<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VOID RUN</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="shell">
    <section class="hud" aria-label="Game status">
      <div><span class="label">SCORE</span><span id="score">0</span></div>
      <div><span class="label">BEST</span><span id="best">0</span></div>
      <div><span class="label">LEVEL</span><span id="level">1</span></div>
    </section>

    <div class="frame">
      <canvas id="game" width="960" height="600" aria-label="VOID RUN game canvas"></canvas>
      <div id="overlay" class="overlay">
        <h1>VOID RUN</h1>
        <p>Survive the swarm. Collect energy shards. Keep moving.</p>
        <p class="controls">WASD / ARROWS · SPACE TO START</p>
      </div>
    </div>

    <p class="hint">Move to evade enemies. Cyan shards increase score and briefly slow the swarm.</p>
  </main>

  <script src="game.js"></script>
</body>
</html>
